<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Flask To-Do List</title>
    <!-- Bootstrap CDN for styling -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          integrity="sha384-JcKb8q3iqJ61gNVWv6fj2eWlDz0POfb2V5i xRwxmP4YfRvH+8abtTE1Pi6jizo"
          crossorigin="anonymous">
    <style>
        /* Custom styling thori si spacing aur centering ke liye */n
        body {
            background-color: #f8f9fa;
        }
        .todo-card {
            max-width: 600px;
            margin: 50px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .todo-header {
            background-color: #343a40;
            color: white;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .table thead th {
            background-color: #6c757d;
            color: white;
        }
        .no-tasks {
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="todo-card card">
    <div class="card-header text-center todo-header">
        <h2 class="mb-0">My To-Do List</h2>
    </div>
    <div class="card-body">

        <!-- Agar update karna hai to ye form show hoga -->
        {% if task %}
        <div class="mb-4">
            <form method="POST">
                <div class="input-group">
                    <input type="text" name="content" class="form-control"
                           value="{{ task.content }}" placeholder="Update your task">
                    <div class="input-group-append">
                        <button class="btn btn-primary" type="submit">Update</button>
                    </div>
                </div>
            </form>
        </div>
        {% endif %}

        <!-- Naya task add karne ka form -->
        {% if not task %}
        <div class="mb-4">
            <form method="POST">
                <div class="input-group">
                    <input type="text" name="content" class="form-control"
                           placeholder="Enter a new task" autocomplete="off">
                    <div class="input-group-append">
                        <button class="btn btn-success" type="submit">Add Task</button>
                    </div>
                </div>
            </form>
        </div>
        {% endif %}

        <!-- Tasks ko table mein list karen -->
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th style="width: 10%;">#</th>
                    <th style="width: 50%;">Task</th>
                    <th style="width: 25%;">Date Created</th>
                    <th style="width: 15%;">Actions</th>
                </tr>
                </thead>
                <tbody>
                {% for t in tasks %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ t.content }}</td>
                        <td>{{ t.date_created.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                        <td>
                            <!-- Update aur Delete buttons -->
                            <a href="{{ url_for('update', id=t.id) }}"
                               class="btn btn-sm btn-info mr-1">Update</a>
                            <a href="{{ url_for('delete', id=t.id) }}"
                               class="btn btn-sm btn-danger">Delete</a>
                        </td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="4" class="text-center no-tasks">No tasks yet. Add one!</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>

<!-- Bootstrap JS dependencies (optional) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-LtrjvnR4/Jdtp3M0KeU8wyjhZl4HOIbC4llKZ4kWV8uW8RayuNdE7FVm5upW2h3z"
        crossorigin="anonymous"></script>
</body>
</html>
